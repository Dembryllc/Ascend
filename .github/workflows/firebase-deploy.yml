name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyD5sUHH11e0Y1KeNpzEX6Ba9XNlhpNFKKk
          VITE_FIREBASE_AUTH_DOMAIN: ascend-annotate.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ascend-annotate
          VITE_FIREBASE_STORAGE_BUCKET: ascend-annotate.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "97329229065"
          VITE_FIREBASE_APP_ID: "1:97329229065:web:7120ef7d461ff67ba6f7d8"

      - name: Deploy to Firebase Hosting
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASCEND_ANNOTATE }}' > /tmp/sa.json
          npx firebase-tools@latest deploy --only hosting --project ascend-annotate
          rm -f /tmp/sa.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
