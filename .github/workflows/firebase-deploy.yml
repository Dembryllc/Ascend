name: Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (required by Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        # Retry once through a cleared cache: the runner's shared npm cache
        # intermittently corrupts, failing `npm ci` with EEXIST/ENOENT on a
        # _cacache rename before anything is built (run #88). Harmless on success.
        run: npm ci --legacy-peer-deps || (npm cache clean --force && npm ci --legacy-peer-deps)

      - name: Firestore rules tests
        run: npm run test:rules

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Retry once through a cleared cache: the runner's shared npm cache
        # intermittently corrupts, failing `npm ci` with EEXIST/ENOENT on a
        # _cacache rename before anything is built (run #88). Harmless on success.
        run: npm ci --legacy-peer-deps || (npm cache clean --force && npm ci --legacy-peer-deps)

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyD5sUHH11e0Y1KeNpzEX6Ba9XNlhpNFKKk
          VITE_FIREBASE_AUTH_DOMAIN: easy-annotate.com
          VITE_FIREBASE_PROJECT_ID: ascend-annotate
          VITE_FIREBASE_STORAGE_BUCKET: ascend-annotate.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "97329229065"
          VITE_FIREBASE_APP_ID: "1:97329229065:web:7120ef7d461ff67ba6f7d8"
          # Falls back to Stripe TEST payment links until STRIPE_PRO_*_URL repo secrets are set —
          # add those secrets (live Payment Link URLs from the Stripe dashboard) to go live with no code change.
          VITE_STRIPE_PRO_MONTHLY_URL: ${{ secrets.STRIPE_PRO_MONTHLY_URL || 'https://buy.stripe.com/test_8x2fZg86rbr1gk57V9a3u00' }}
          VITE_STRIPE_PRO_ANNUAL_URL: ${{ secrets.STRIPE_PRO_ANNUAL_URL || 'https://buy.stripe.com/test_4gMbJ086rcv59VHdfta3u01' }}

      - name: Deploy to Firebase Hosting and Firestore config
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASCEND_ANNOTATE }}
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa.json
          trap 'rm -f /tmp/sa.json /tmp/firebase-deploy.log' EXIT
          npm install -g firebase-tools
          set +e
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy \
            --only hosting,firestore:rules,firestore:indexes,storage \
            --project ascend-annotate 2>&1 | tee /tmp/firebase-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e

          if [ "$deploy_status" -ne 0 ]; then
            if grep -Fq "supplied version" /tmp/firebase-deploy.log \
              && grep -Fq "current active version" /tmp/firebase-deploy.log; then
              echo "Firebase Hosting already has this version live; treating deploy as successful."
            else
              exit "$deploy_status"
            fi
          fi
